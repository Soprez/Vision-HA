name: Problème · Bug
description: Quelque chose ne marche pas comme prévu. · Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Ne collez ni jeton, ni clé d'inscription, ni adresse, ni nom de personne : remplacez-les (`ha.exemple.org`, `Demandeur 1`).
        Do not paste tokens, enrollment keys, addresses or people's names: replace them.
  - type: dropdown
    id: partie
    attributes:
      label: Partie · Part
      options:
        - Intégration Home Assistant · Integration
        - Application Android (téléphone / phone)
        - Application Android (télé / TV)
        - Agent Windows · Windows agent
        - Cartes du tableau de bord · Dashboard cards
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Vision (intégration), appli / app, agent, Home Assistant
      placeholder: "Vision 2.5.8, appli 1.93.03, agent 1.93.2, HA 2026.10.1"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui se passe · What happens
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui était attendu · What you expected
  - type: textarea
    id: etapes
    attributes:
      label: Pour reproduire · Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: textarea
    id: journaux
    attributes:
      label: Journaux · Logs
      description: Paramètres → Système → Journaux, filtrés sur « pc_parental » (relisez-les avant de coller).
      render: text
