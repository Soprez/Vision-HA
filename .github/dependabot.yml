# Mises à jour proposées chaque semaine : actions GitHub, dépendances des essais Python, Gradle (Android).
# Les exigences de l'intégration (manifest.json) suivent Home Assistant : Dependabot ne les lit pas.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dépendances]

  - package-ecosystem: pip
    directory: /essai
    schedule:
      interval: weekly
    labels: [dépendances]
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /android/src
    schedule:
      interval: weekly
    labels: [dépendances]
    open-pull-requests-limit: 5
    # Montées lourdes, faites à la main plus tard (1.93.06) : AGP 9, okhttp 5, androidx.core 1.19 et au-delà.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.core:*"
        versions: [">= 1.19.0"]
