# Validation officielle à chaque envoi : hassfest (Home Assistant) et HACS.
name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Aucun contrôle ignoré (exigence du catalogue par défaut de HACS) : l'icône vient du dossier
          # brand/ de l'intégration (custom_components/pc_parental/brand/icon.png).
