# Validation officielle à chaque envoi : hassfest (Home Assistant) et HACS.
name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Vision n'est pas (encore) dans home-assistant/brands : son icône vient de l'intégration.
          ignore: brands
