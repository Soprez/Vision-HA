# Essais de Vision à chaque envoi : intégration et agent (pytest, en 4 parts) et application Android (JVM).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Intégration (part ${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: essai/requirements.txt
      # Essais à navigateur (clics, débordement) : Node 22 (WebSocket intégré) et Chrome, déjà sur le runner.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Roboto : la police de Home Assistant (et du banc Windows) ; sans elle, Chrome prend DejaVu Sans, plus
      # large, et l'essai anti-débordement voit des textes coupés qui ne le sont pas dans Home Assistant.
      - name: Paquets système
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg ffmpeg fonts-roboto
      - name: Dépendances
        run: pip install -r essai/requirements.txt
      - name: Essais
        working-directory: essai
        run: |
          fichiers=$(ls *_test.py | sort | awk -v p=${{ matrix.part }} '(NR - 1) % 4 == p')
          python -m pytest -q -p no:cacheprovider -o asyncio_mode=auto $fichiers

  android:
    name: Application Android (essais JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Essais
        run: gradle -p android/src testDebugUnitTest --no-daemon
